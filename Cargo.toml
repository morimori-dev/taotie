[workspace]
resolver = "2"
members = [
  "crates/taotie-api",
  "crates/taotie-jobs",
  "crates/taotie-mcp",
  "crates/taotie-parsers",
  "crates/taotie-schema",
  "crates/taotie-search",
  "crates/taotie-storage",
]
exclude = ["src-tauri"]

[workspace.package]
edition = "2021"
license = "MIT OR Apache-2.0"
version = "0.1.0"

[workspace.dependencies]
anyhow = "1.0.100"
arrow-array = "59.0.0"
arrow-schema = "59.0.0"
base64 = "0.22.1"
chrono = { version = "0.4.42", features = ["clock", "serde"] }
duckdb = { version = "1.10504.0", features = ["bundled", "parquet"] }
ed25519-dalek = "2.2.0"
encoding_rs = "0.8.35"
evtx = { version = "0.12.2", default-features = false }
flate2 = "1.1.5"
getrandom = "0.3.4"
hex = "0.4.3"
parquet = { version = "59.0.0", default-features = false, features = ["arrow", "zstd"] }
prefetch-core = "0.1.0"
rusqlite = { version = "0.37.0", features = ["bundled", "chrono"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
sha2 = "0.10.9"
tantivy = "0.26.1"
tempfile = "3.27.0"
thiserror = "2.0.18"
tracing = "0.1.41"
uuid = { version = "1.23.3", features = ["v4", "serde"] }
