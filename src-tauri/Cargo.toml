[package]
name = "taotie-app"
edition = "2021"
license = "MIT OR Apache-2.0"
version = "0.1.0"
build = "build.rs"

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
rfd = "0.16.0"
taotie-api = { path = "../crates/taotie-api" }
taotie-schema = { path = "../crates/taotie-schema" }
tauri = { version = "2.11.3", features = [] }
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
