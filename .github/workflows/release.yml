name: release

# Build distributable bundles and attach them to a GitHub release.
#   - Windows: NSIS installer (.exe) + portable zip (taotie.exe + taotie-mcp.exe)
#   - Linux:   AppImage (download-and-run) + .deb
#   - Both:    the standalone read-only MCP server binary
# Trigger: push a tag like v0.1.0, or run manually (workflow_dispatch builds
# the bundles and uploads them as workflow artifacts without creating a release).

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: ubuntu-22.04
            bundles: appimage,deb
          - platform: windows-latest
            bundles: nsis
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: |
            .
            src-tauri

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: ui/package-lock.json

      - name: Install Linux system dependencies
        if: startsWith(matrix.platform, 'ubuntu')
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev patchelf libfuse2

      - name: Install frontend dependencies
        working-directory: ui
        run: npm ci

      - name: Build bundles
        working-directory: ui
        shell: bash
        run: npm run taotie:build -- --bundles ${{ matrix.bundles }}

      # Read-only MCP stdio server (separate binary; built in the root workspace).
      - name: Build MCP server
        shell: bash
        run: cargo build --release -p taotie-mcp

      # Standalone exe: frontend assets and DuckDB are embedded, so the bare
      # binary runs without installation (WebView2 runtime must be present).
      # The portable zip also ships the MCP server next to it.
      - name: Package portable exe (Windows)
        if: startsWith(matrix.platform, 'windows')
        shell: pwsh
        run: |
          $ver = (Get-Content src-tauri/tauri.conf.json | ConvertFrom-Json).version
          New-Item -ItemType Directory -Force -Path portable | Out-Null
          $app = if (Test-Path 'src-tauri/target/release/taotie.exe') { 'src-tauri/target/release/taotie.exe' } else { 'src-tauri/target/release/taotie-app.exe' }
          Copy-Item $app portable/taotie.exe
          Copy-Item target/release/taotie-mcp.exe portable/taotie-mcp.exe
          Compress-Archive -Path portable/* -DestinationPath "src-tauri/target/release/bundle/taotie_${ver}_x64-portable.zip" -Force

      # Stage the standalone MCP binary with a versioned, platform-tagged name.
      - name: Stage MCP binary
        shell: bash
        run: |
          ver=$(node -p "require('./src-tauri/tauri.conf.json').version")
          mkdir -p dist
          if [ "$RUNNER_OS" = "Windows" ]; then
            cp target/release/taotie-mcp.exe "dist/taotie-mcp_${ver}_x64.exe"
          else
            cp target/release/taotie-mcp "dist/taotie-mcp_${ver}_amd64"
          fi

      - name: Attach bundles to release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          name: Taotie ${{ github.ref_name }}
          files: |
            src-tauri/target/release/bundle/appimage/*.AppImage
            src-tauri/target/release/bundle/deb/*.deb
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/*-portable.zip
            dist/taotie-mcp_*

      - name: Upload workflow artifacts (manual run)
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        uses: actions/upload-artifact@v4
        with:
          name: taotie-${{ matrix.platform }}
          path: |
            src-tauri/target/release/bundle/appimage/*.AppImage
            src-tauri/target/release/bundle/deb/*.deb
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/*-portable.zip
            dist/taotie-mcp_*
